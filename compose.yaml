name: desafio-ciee

x-sql-environment: &sql-environment
  ACCEPT_EULA: "Y"
  MSSQL_PID: Developer
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD no arquivo de ambiente Docker}

services:
  sqlserver:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment: *sql-environment
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  database-setup:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      <<: *sql-environment
      MSSQL_DATABASE: ${MSSQL_DATABASE:-ciee}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if [[ ! "$$MSSQL_DATABASE" =~ ^[a-zA-Z][a-zA-Z0-9_]{0,62}$$ ]]; then
          echo 'MSSQL_DATABASE deve começar com letra e conter apenas letras, números ou sublinhado.' >&2
          exit 1
        fi
        SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -Q "IF DB_ID(N'$$MSSQL_DATABASE') IS NULL CREATE DATABASE [$$MSSQL_DATABASE]"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  migrations:
    image: desafio-ciee-migrations:local
    build:
      context: ./backend
      target: migrations
    environment:
      DATABASE_URL: "sqlserver://sqlserver:1433;database=${MSSQL_DATABASE:-ciee};user=sa;password=${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD};encrypt=true;trustServerCertificate=true"
    depends_on:
      database-setup:
        condition: service_completed_successfully
    restart: "no"

  seed:
    image: desafio-ciee-migrations:local
    build:
      context: ./backend
      target: migrations
    entrypoint: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: "sqlserver://sqlserver:1433;database=${MSSQL_DATABASE:-ciee};user=sa;password=${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD};encrypt=true;trustServerCertificate=true"
    depends_on:
      migrations:
        condition: service_completed_successfully
    profiles: ["seed"]
    restart: "no"

  backend:
    container_name: backend
    image: desafio-ciee-backend:local
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: "3333"
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-20}
      PDF_PARSE_TIMEOUT_MS: ${PDF_PARSE_TIMEOUT_MS:-15000}
      PDF_PARSE_CONCURRENCY: ${PDF_PARSE_CONCURRENCY:-2}
      PDF_RENDER_SCALE: ${PDF_RENDER_SCALE:-1.5}
      PDF_RENDER_MAX_PIXELS: ${PDF_RENDER_MAX_PIXELS:-16000000}
      DATABASE_URL: "sqlserver://sqlserver:1433;database=${MSSQL_DATABASE:-ciee};user=sa;password=${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD};encrypt=true;trustServerCertificate=true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/resumes?limit=1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrations:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
  
  frontend:
    container_name: frontend
    image: desafio-ciee-frontend:local
    build:
      context: ./frontend
      target: runner
    environment:
      PORT: "3000"
      BACKEND_URL: "http://backend:3333"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
volumes:
  sqlserver-data:
